name: monthly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 15 * *' # 05:00 UTC on the 15th (GitHub Actions schedules are UTC)

permissions:
  contents: write

concurrency:
  group: data-processing
  cancel-in-progress: false

jobs:
  data_processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Look for new bulletines
        run: jupyter nbconvert --to notebook --execute --output-dir /tmp/executed-notebooks "notebooks/1_Bulletines_4_Monthly_scraper.ipynb"

      - name: Clean bulletines
        run: jupyter nbconvert --to notebook --execute --output-dir /tmp/executed-notebooks "notebooks/1_Bulletines_3_Clean.ipynb"

      - name: Analyzing the data
        run: jupyter nbconvert --to notebook --execute --output-dir /tmp/executed-notebooks "notebooks/1_Bulletines_5_Analysis_.ipynb"

      - name: Publish data snapshot with the static site
        run: node scripts/publish-site-data.mjs

      - name: Validate derived data and dashboard logic
        run: npm test
        
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/clean outputs/raw outputs/viz docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Automated data processing"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main
